services:
  airflow:
    build: .
    container_name: local-airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-secret-key
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ..:/opt/data-platform
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Nordans --lastname Local --role Admin --email admin@example.com || true &&
      airflow standalone
      "
    depends_on:
      - postgres
      
  postgres:
    image: postgres:16
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: data_user
      POSTGRES_PASSWORD: data_pass
      POSTGRES_DB: data_platform
    ports:
      - "5432:5432"
    volumes:
      - ../postgres-data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: local-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      - postgres